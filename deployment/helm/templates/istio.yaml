{{- if .Values.app.ingress.enabled }}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .Release.Name }}-istio
  labels:
    app: {{ .Release.Name }}
    environment: {{ .Values.app.env }}
spec:
  hosts:
    - {{ .Values.app.ingress.hosts }}
  gateways:
    - {{ .Values.app.ingress.gateways }}
  http:
    - match:
        - uri:
            prefix: {{ .Values.app.baseHref | quote }}
      rewrite:
        uri: {{ .Values.app.baseHref | quote }}
      route:
        - destination:
            host: "{{ .Release.Name }}-service"
            port:
              number: {{ .Values.app.service.port }}
{{- end }}
